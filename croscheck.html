<!DOCTYPE html>
<html lang="id">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>Croscheck</title>

    <link
        rel="stylesheet"
        href="css/croscheck.css">

</head>


<body>


<header class="header">

    <div class="header-inner">

        <button
            id="btnBack"
            class="back-button"
            type="button">
            ‹
        </button>

        <h1>✓ Croscheck</h1>

        <div class="header-spacer"></div>

    </div>

</header>



<main class="container">


    <!-- =========================
         FILTER CROS CHECK
    ========================== -->

    <section class="control-card">


        <div class="top-controls">


            <!-- FILTER RAK -->

            <div class="rak-filter">

                <span class="rak-label">
                    Rak
                </span>

                <button
                    id="btnRakFilter"
                    class="rak-filter-button"
                    type="button">

                    <span id="rakFilterText">
                        Semua Rak
                    </span>

                    <span class="rak-arrow">
                        ▾
                    </span>

                </button>


                <!-- POPUP FILTER RAK -->

                <div
                    id="rakPopup"
                    class="rak-popup">


                    <div class="rak-popup-title">
                        Filter Rak
                    </div>


                    <!-- MODE -->

                    <div class="rak-mode">


                        <label>

                            <input
                                type="radio"
                                name="rakMode"
                                value="all"
                                checked>

                            <span>
                                Semua Rak
                            </span>

                        </label>


                        <label>

                            <input
                                type="radio"
                                name="rakMode"
                                value="select">

                            <span>
                                Pilih Rak
                            </span>

                        </label>


                        <label>

                            <input
                                type="radio"
                                name="rakMode"
                                value="range">

                            <span>
                                Rentang Rak
                            </span>

                        </label>


                    </div>



                    <!-- PILIH RAK -->

                    <div
                        id="selectRakArea"
                        class="rak-option-area"
                        style="display:none;">

                        <div class="rak-option-header">
                            <div class="rak-option-title">
                                Pilih Rak
                            </div>

                            <input
                                id="inputSearchRak"
                                class="rak-search-input"
                                type="text"
                                placeholder="🔎 Ketik rak..."
                                autocomplete="off">
                        </div>

                        <div
                            id="rakList"
                            class="rak-list">
                        </div>

                        <div
                            id="rakSelectedList"
                            class="rak-selected-list">
                        </div>

                    </div>


                    <!-- RENTANG RAK -->

                    <div
                        id="rangeRakArea"
                        class="rak-option-area"
                        style="display:none;">

                        <div class="range-rak-row">

                            <div class="range-rak-field">

                                <label>
                                    Dari
                                </label>

                                <input
                                    id="inputSearchRakFrom"
                                    class="rak-search-input range-search-input"
                                    type="text"
                                    placeholder="🔎 Ketik rak..."
                                    autocomplete="off">

                                <div
                                    id="rakRangeFromList"
                                    class="rak-list range-rak-list">
                                </div>

                            </div>


                            <div class="range-rak-field">

                                <label>
                                    Sampai
                                </label>

                                <input
                                    id="inputSearchRakTo"
                                    class="rak-search-input range-search-input"
                                    type="text"
                                    placeholder="🔎 Ketik rak..."
                                    autocomplete="off">

                                <div
                                    id="rakRangeToList"
                                    class="rak-list range-rak-list">
                                </div>

                            </div>

                        </div>

                    </div>



                    <!-- TOMBOL -->

                    <div class="rak-popup-footer">

                        <button
                            id="btnCancelRak"
                            class="rak-cancel"
                            type="button">

                            Batal

                        </button>


                        <button
                            id="btnApplyRak"
                            class="rak-apply"
                            type="button">

                            Terapkan

                        </button>

                    </div>


                </div>

            </div>



            <!-- HIDDEN COPY -->

            <label class="toggle-control">

                <span>
                    Hidden Copy
                </span>

                <span class="switch">

                    <input
                        id="toggleHiddenCopy"
                        type="checkbox">

                    <span class="slider"></span>

                </span>

            </label>


        </div>



        <!-- SEARCH -->

        <input
            id="inputSearch"
            class="search-input"
            type="text"
            placeholder="🔎 Cari barcode / nama produk..."
            autocomplete="off">


        <!-- JUMLAH ITEM -->

        <div
            id="itemInfo"
            class="item-info">

            Showing 0 of 0 item

        </div>


    </section>



    <!-- =========================
         TABEL PRODUK
    ========================== -->

    <section class="table-card">


        <div class="table-wrap">


            <table>


                <thead>

                    <tr>

                        <th class="col-code">
                            Barcode
                        </th>


                        <th class="col-product">
                            Nama Barang
                        </th>


                        <th class="col-stock">
                            Stok
                        </th>


                        <th class="col-rack">
                            Rak
                        </th>

                    </tr>

                </thead>


                <tbody
                    id="productTableBody">
                </tbody>


            </table>


        </div>



        <div
            id="emptyState"
            class="empty-state">

            Belum ada data produk.

        </div>



        <!-- PAGINATION -->

        <div class="pagination">


            <button
                id="btnPrev"
                type="button">

                ‹

            </button>


            <span id="pageInfo">
                Halaman 1 / 1
            </span>


            <button
                id="btnNext"
                type="button">

                ›

            </button>


        </div>


    </section>


</main>



<script
    src="https://cdn.jsdelivr.net/npm/xlsx/dist/xlsx.full.min.js">
</script>


<script src="js/croscheck.js"></script>


</body>

</html>
