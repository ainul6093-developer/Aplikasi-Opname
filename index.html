<!DOCTYPE html>
<html lang="id">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Opname Toko</title>

    <link rel="stylesheet" href="css/style.css">

</head>

<body>

<div class="header">

    <div class="container">

        <div style="
            display:flex;
            align-items:center;
            justify-content:space-between;
            width:100%;">

            <h1 style="
                margin:0;
                font-size:24px;">
                📦 Opname Toko
            </h1>

            <div style="
                display:flex;
                align-items:center;
                gap:8px;">

                <button
                    id="btnReset"
                    type="button"
                    style="
                    border:none;
                    background:#dc3545;
                    color:white;
                    border-radius:8px;
                    padding:8px 12px;
                    font-size:14px;
                    font-weight:bold;">
                    ↻ RESET
                </button>

                <button
                    id="btnMenu"
                    type="button"
                    style="
                    border:none;
                    background:transparent;
                    font-size:26px;
                    padding:4px;">
                    ⋮
                </button>

            </div>

        </div>

    </div>

</div>

    <div class="container">


        <!-- Tombol Scan -->

        <!-- IMPORT FILE EXCEL -->
<div class="card">

    <input
        type="file"
        id="excelFile"
        accept=".xls,.xlsx">

    <p id="statusImport" style="
    margin-top:10px;
    font-size:16px;
    font-weight:bold;
    color:#28a745;
    ">

        📂 Belum ada file dipilih

    </p>

</div>

</div>

          <!-- PENCARIAN PRODUK -->

<div class="card">

    <input
        type="text"
        id="inputCariProduk"
        placeholder="🔎 Cari nama produk / barcode..."
        autocomplete="off">

    <div id="hasilPencarianProduk"></div>

</div>
  
        <!-- TOMBOL SCAN BARCODE -->

    <button
        class="scan-button"
        id="btnScan">

        📷 SCAN BARCODE

    </button>

    <div
    id="scannerArea"
    style="
    position:relative;
    width:100%;
    margin-top:15px;
    display:none;">

    <div
        id="reader"
        style="
        width:100%;">
    </div>

<button
    id="btnTorch"
    title="Senter"
    style="
    display:block;
    position:absolute;
    top:10px;
    right:10px;
    z-index:999;
    width:50px;
    height:50px;
    padding:0;
    border:none;
    border-radius:50%;
    background:rgba(0,0,0,0.55);
    color:white;
    font-size:27px;
    font-weight:bold;">

    ⚡

</button>

</div>

</div>


        </div>


        <!-- Informasi Produk -->

        <div class="card">

<div class="label">

KODE

</div>

<div
id="barisKode"
style="
display:flex;
justify-content:space-between;
align-items:center;
margin-bottom:15px;">

<div
id="kodeProduk"
style="
font-size:18px;
font-weight:bold;">

-

</div>

<button
id="copyKode"
style="
border:none;
background:none;
font-size:22px;">

📋

</button>

</div>
            <div class="label">
                PRODUK
            </div>

            <div class="product-name" id="namaProduk">

    Belum ada produk

</div>


            <div class="info-row">

                <span>Rak</span>

                <strong id="rakProduk">-</strong>

            </div>


            <div class="info-row">

                <span>Stok Sistem</span>

                <span
class="stock-system"
id="stokProduk">

-

</span>

            </div>

        </div>


        <!-- Input Fisik -->

        <div class="card">
          
<div
    style="
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:15px;">

    <div class="label" style="margin:0;">
        STOK KULKAS
    </div>

    <label style="
        position:relative;
        display:inline-block;
        width:52px;
        height:30px;">

        <input
            type="checkbox"
            id="toggleKulkas"
            style="
            opacity:0;
            width:0;
            height:0;">

        <span style="
            position:absolute;
            cursor:pointer;
            inset:0;
            background:#bdbdbd;
            border-radius:30px;
            transition:0.3s;"
            id="kulkasSwitch">

            <span style="
                position:absolute;
                content:'';
                height:24px;
                width:24px;
                left:3px;
                top:3px;
                background:white;
                border-radius:50%;
                transition:0.3s;"
                id="kulkasKnob">
            </span>

        </span>

    </label>

</div>

<div id="stokKulkasArea" style="display:none;">

    <input
        id="stokKulkas"
        type="number"
        placeholder="Masukkan stok kulkas">

</div>


<div class="label" style="margin-top:15px;">

    STOK FISIK

</div>

<input
id="stokFisik"
type="number"
placeholder="Masukkan jumlah fisik">


<div class="label" style="margin-top:15px;">

    TOTAL FISIK

</div>

<div
id="totalFisik"
style="
font-size:28px;
font-weight:bold;
padding:10px 0;">

0

</div>
            

            <button
id="btnSimpan"
class="save-button">

              ✓ SIMPAN OPNAME

</button>


<div
id="dataTersimpan"
style="margin-top:20px;">

</div>
        </div>
        
<script src="https://cdn.jsdelivr.net/npm/xlsx/dist/xlsx.full.min.js"></script>
<script src="https://unpkg.com/html5-qrcode"></script>
<script src="js/app.js"></script>
</body>

</html>
